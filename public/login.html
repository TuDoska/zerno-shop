<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — Зерно</title>
  <meta name="description" content="Зерно — інтернет-магазин свіжообсмаженої спешелті-кави, чаю та аксесуарів для заварювання з доставкою по Україні.">
  <meta name="theme-color" content="#2f5d50">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container page page--narrow">
    <div class="panel auth">
      <h1 class="page__title" style="margin:0">Вітаємо в «Зерні»</h1>
      <div class="segmented"><button type="button" data-mode="login">Вхід</button><button type="button" data-mode="register">Реєстрація</button></div>
      <form id="auth-form" class="auth" style="gap:16px">
        <label class="label">Імʼя користувача<input class="field" name="username" autocomplete="username" required maxlength="20"><small class="muted hint">3–20 символів: латиниця, цифри, _</small></label>
        <label class="label">Пароль<input class="field" name="password" type="password" autocomplete="current-password" required maxlength="100"><small class="muted hint">Щонайменше 6 символів</small></label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn btn--accent btn--block">Увійти</button>
      </form>
      <p class="muted small">Акаунт потрібен, щоб бачити історію замовлень і зберігати обране. Купувати можна і без нього.</p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
