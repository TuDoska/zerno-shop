<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Зерно</title>
  <meta name="description" content="Зерно — інтернет-магазин свіжообсмаженої спешелті-кави, чаю та аксесуарів для заварювання з доставкою по Україні.">
  <meta name="theme-color" content="#2f5d50">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container page">
    <nav class="crumbs"><a href="./">Головна</a> / Каталог</nav>
    <div class="shop">
      <aside class="filters" id="filters">
        <section><h4>Категорія</h4><div class="filter-list" id="f-cats"></div></section>
        <section><h4>Обсмаження</h4><div class="filter-list" id="f-roast"></div></section>
        <section><h4>Ціна, ₴</h4>
          <form id="price-form" style="display:grid;gap:8px">
            <div class="price-range"><input class="field" id="f-min" type="number" min="0" placeholder="від"><input class="field" id="f-max" type="number" min="0" placeholder="до"></div>
            <button class="btn btn--ghost btn--small">Застосувати</button>
          </form>
        </section>
      </aside>
      <div>
        <div class="toolbar">
          <div><h1 class="page__title" id="title" style="margin:0">Каталог</h1><span class="muted" id="count"></span></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn--ghost btn--small filters-toggle" id="toggle-filters">Фільтри</button>
            <select class="field field--small" id="sort" aria-label="Сортування">
              <option value="popular">Спочатку популярні</option>
              <option value="new">Спочатку нові</option>
              <option value="price_asc">Дешевші</option>
              <option value="price_desc">Дорожчі</option>
              <option value="rating">За рейтингом</option>
            </select>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
