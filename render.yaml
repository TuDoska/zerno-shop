services:
  - type: web
    name: zerno-shop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DB
        value: zerno
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
